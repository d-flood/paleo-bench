[bench]
name = "Paleo Benchmark Run"
output = "static/results.json"
max_concurrency = 3

[bench.provider_cooldown_seconds]
anthropic = 10
openai = 10
google = 10
openrouter = 10

[prompts]
system = """
You are an expert at reading handwritten text. 
Be exeedingly exact and precise in your transcription. 
Do not attempt to correct or interpret the text in any way. 
Transcribe the text exactly as it appears in the image, 
including any errors, abbreviations, or unusual characters. 
Focus solely on accurately capturing the handwritten content 
without adding any additional information or context.

Be mindful to use the proper sigma if it is the final letter of a word.

If you encounter a correction, transcribe it like this: "{first hand text / corrector text}".
Mark corrections with curly braces and include whole words, not just individual letters.

For multiple columns, transcribe the text one column at a time. 
Identify columns as "Column 1", "Column 2", etc. 
and transcribe the text in each column separately, 
maintaining the original order of the columns.
Add a line break between both the column labels and the transcribed text.
Do not identify a column if there is only one column of text.

**NEVER include any explanation, commentary, or additional information in your response.
Output only the transcription, nothing else.**
Do not transcribe diacritics like breathing marks, accents, or iota subscripts.
"""
user = "Transcribe the handwritten text in this image exactly as written."

[pipeline]
continuous_notes = """
Transcribe only the main text block. Do not transcribe chapter numbers or titles, marginal notes, lection notes or anything else written in the margins or outside the text block.
Write only what is on the page. Never complete, continue or supply text from memory, even when you recognise the passage.
The scribe's spelling often departs from the standard: ι, η, υ, ει and οι are often interchanged, as are ο and ω, and ε and αι. Keep the scribe's spelling.
"""
lectionary_notes = """
Transcribe every line of the text block, including rubrics, lection titles and liturgical headings written within it.
Lections often stop in mid-verse, followed directly by a rubric or the next lection's title. Write only the words on the page: never finish a verse, and never complete, continue or supply text from memory, even when you recognise the passage.
Do not transcribe crosses, ekphonetic signs or other marks. Write the και abbreviation as και.
The scribe's spelling often departs from the standard: ι, η, υ, ει and οι are often interchanged, as are ο and ω, and ε and αι. Keep the scribe's spelling.
"""
check_system = "You are an expert palaeographer of Byzantine Greek minuscule. Be exceedingly exact. Ignore accents, breathings, iota subscripts and punctuation."
check_user = """
Below is a draft transcription of the page in the image, as JSON. Each key is a word ID, L<line>.<position>, and each value is the draft's reading of that word.

The draft was made by a reader who knows this text well. Such readers tend to restore the standard spelling where the scribe wrote something else, especially in familiar words. They also sometimes invent misspellings where the scribe wrote the standard form. Catch both.

Work line by line. For each word, find it on the page and compare each vowel in the draft with the letter shape in the image:
- ο (one small loop) or ω (two bowls side by side)
- ι (single short stroke), η (h-shaped or Η-shaped), υ (u- or v-shaped), ει, οι
- ε or αι
Check consonants too, but most errors are in the vowels.

Report a word only when the page clearly shows different letters from the draft. If the page is unclear, keep the draft's reading.
For each correction, give the scribe's letters as text, and in "change" name the letters that differ, for example "ι→η".
Correct letters only. Do not expand or contract abbreviations or nomina sacra, and do not change where words divide.
If a draft word is not on the page at all, give an empty string as text.
Return an empty list if every word is correct.

Draft:
"""

